# Keeps the booking store in step with coursedates.csv, which stays the source
# of truth for course dates.
#
# Validation runs on every push and pull request that touches the dates, so a
# malformed row or a missing capacity is caught before it reaches main. Sending
# them to the booking API is a manual run: there is no Worker deployed yet, and
# nothing should be pushed to it by accident once there is.
#
# Until BOOKING_API is set the sync step reports and stops rather than failing.

name: 🔄 Sync course dates and check prices

on:
  push:
    branches: [main]
    paths:
      - "coursedates.csv"
      - "prices.csv"
      - "content/**"
      - "booking/**"
      - "tools/check-prices.mjs"
      - ".github/workflows/booking-sync.yaml"
  pull_request:
    paths:
      - "coursedates.csv"
      - "prices.csv"
      - "content/**"
      - "booking/**"
      - "tools/check-prices.mjs"
      - ".github/workflows/booking-sync.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "booking-sync"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Validate the dates and prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the booking tests
        working-directory: booking
        # `npm test` rather than the file list, so this and package.json cannot
        # drift into running different sets.
        run: npm test

      - name: Check that every price is used
        run: node tools/check-prices.mjs

      - name: Validate coursedates.csv
        run: node booking/sync-events.mjs --dry-run

  sync:
    name: Sync to the booking API
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync
        env:
          BOOKING_API: ${{ secrets.BOOKING_API }}
          BOOKING_ADMIN_TOKEN: ${{ secrets.BOOKING_ADMIN_TOKEN }}
        run: |
          if [ -z "${BOOKING_API}" ] || [ -z "${BOOKING_ADMIN_TOKEN}" ]; then
            echo "::notice::BOOKING_API/BOOKING_ADMIN_TOKEN not set; skipping sync."
            echo "Set both repository secrets once the booking Worker is deployed."
            exit 0
          fi
          node booking/sync-events.mjs
