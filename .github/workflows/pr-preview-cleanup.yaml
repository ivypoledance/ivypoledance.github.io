# Tears down the staging environment created by pr-preview.yaml once the pull
# request closes or merges: detaches the custom domain, deletes the DNS record
# and force-deletes the branch's deployments.
#
# Cloudflare does not expire previews on its own, so this is what keeps the
# project tidy and under its custom-domain limit (100 on the free plan).
#
# Deleting a deployment that still holds a branch alias needs force=true;
# without it Cloudflare keeps the newest deployment per branch and the whole
# site would stay served from pr-<number>.<project>.pages.dev.

name: Remove PR preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: "pr-preview-${{ github.event.number }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CF_PROJECT: "ivypoledance-staging"
  STAGING_ZONE: "ivypoledance.at"
  STAGING_SUFFIX: "staging.ivypoledance.at"

jobs:
  teardown:
    name: 🗑️ Tear down the preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Remove the subdomain, DNS record and deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.number }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          hostname="${BRANCH}.${STAGING_SUFFIX}"
          projects="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"

          # Detach the custom domain first, so the hostname stops resolving even
          # if a later step fails.
          api -X DELETE "${projects}/${CF_PROJECT}/domains/${hostname}" >/dev/null || true
          echo "custom domain detached: ${hostname}"

          zone_id=$(api "https://api.cloudflare.com/client/v4/zones?name=${STAGING_ZONE}" | jq -r '.result[0].id // empty')
          if [ -n "$zone_id" ]; then
            rec=$(api "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${hostname}" | jq -r '.result[0].id // empty')
            if [ -n "$rec" ]; then
              api -X DELETE "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${rec}" >/dev/null || true
              echo "DNS record deleted: ${hostname}"
            fi
          fi

          # force=true is what allows removing the newest deployment, which still
          # carries the branch alias.
          # per_page must stay at 25: this endpoint rejects larger values with
          # error 8000024. The list is re-fetched after each pass instead, since
          # deleting shortens it.
          deleted=0
          for _ in $(seq 1 20); do
            resp=$(api "${projects}/${CF_PROJECT}/deployments?per_page=25")
            if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
              echo "::error::could not list deployments: $(echo "$resp" | jq -c '.errors')"
              exit 1
            fi
            ids=$(echo "$resp" | jq -r --arg b "$BRANCH" '.result[]? | select(.deployment_trigger.metadata.branch == $b) | .id')
            [ -z "$ids" ] && break

            progressed=0
            for id in $ids; do
              out=$(api -X DELETE "${projects}/${CF_PROJECT}/deployments/${id}?force=true")
              if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
                deleted=$((deleted + 1))
                progressed=1
              else
                echo "::warning::could not delete ${id}: $(echo "$out" | jq -c '.errors')"
              fi
            done
            [ "$progressed" -eq 0 ] && break
          done
          echo "deployments deleted: ${deleted}"

      - name: Mark the Staging deployment inactive
        uses: actions/github-script@v9
        with:
          script: |
            // Without this the Staging environment keeps advertising a URL that
            // no longer resolves.
            const ref = context.payload.pull_request.head.ref;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'Staging',
              ref,
            });
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
                state: 'inactive',
                description: 'Preview removed when the pull request closed',
              });
            }
            core.info(`deactivated ${deployments.length} Staging deployment(s) for ${ref}`);

      - name: Note the teardown on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body: `${marker}\nStaging preview removed.`,
              });
            }
