# Builds every pull request and publishes it to its own staging subdomain,
# e.g. PR 12 -> https://pr-12.staging.ivypoledance.at
#
# One-time setup:
#   1. Create an API token with:
#        Account | Cloudflare Pages : Edit
#        Zone    | DNS              : Edit   (zone: ivypoledance.at)
#        Zone    | Zone             : Read   (zone: ivypoledance.at)
#   2. Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# The Pages project is created on first run if missing, so its name cannot drift
# from CF_PROJECT below. Uploads are direct: this workflow builds the site, so
# Cloudflare never needs to (its build image ships an older Zola).
#
# A branch alias only resolves to the preview when its DNS record is proxied and
# its CNAME target carries the branch name. An unproxied or external record
# silently serves production instead, so the record is created with
# proxied=true and targets <branch>.<project>.pages.dev.
#
# Pull requests from forks get no preview: `pull_request` withholds secrets from
# forks, which is the behaviour we want rather than running fork code with a
# token that can edit DNS.

name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "pr-preview-${{ github.event.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ZOLA_VERSION: "0.23.4"
  CF_PROJECT: "ivypoledance-staging"
  STAGING_ZONE: "ivypoledance.at"
  STAGING_SUFFIX: "staging.ivypoledance.at"

jobs:
  preview:
    runs-on: ubuntu-latest
    # Forks cannot receive the deploy token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Records each preview as a deployment of the Staging environment. Every pull
    # request shares this one environment, so its history shows the most recent
    # preview as active and supersedes the previous one.
    environment:
      name: Staging
      url: ${{ steps.names.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Resolve preview names
        id: names
        run: |
          branch="pr-${{ github.event.number }}"
          {
            echo "branch=$branch"
            echo "hostname=$branch.${STAGING_SUFFIX}"
            echo "url=https://$branch.${STAGING_SUFFIX}"
            echo "cname=$branch.${CF_PROJECT}.pages.dev"
          } >> "$GITHUB_OUTPUT"

      # First thing after the name is known, and deliberately before the build:
      # until this record exists the hostname answers NXDOMAIN, and any resolver
      # that looks it up caches that miss for the zone's negative TTL (30
      # minutes). Anyone following the link early would then be unable to reach
      # the preview long after it went live.
      - name: Point DNS at the preview
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTNAME: ${{ steps.names.outputs.hostname }}
          TARGET: ${{ steps.names.outputs.cname }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "$@"; }

          zone_id=$(api "https://api.cloudflare.com/client/v4/zones?name=${STAGING_ZONE}" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::zone ${STAGING_ZONE} not found (token needs Zone:Read)"
            exit 1
          fi

          # Proxied and targeting the branch alias. Unproxied or external
          # records are sent to the project's production branch instead.
          existing=$(api "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${HOSTNAME}" | jq -r '.result[0].id // empty')
          body=$(jq -nc --arg n "$HOSTNAME" --arg c "$TARGET" \
            '{type:"CNAME",name:$n,content:$c,proxied:true,comment:"PR preview, managed by CI"}')
          if [ -n "$existing" ]; then
            api -X PATCH "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${existing}" -d "$body" | jq -e '.success' >/dev/null
          else
            api -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" -d "$body" | jq -e '.success' >/dev/null
          fi
          echo "DNS: ${HOSTNAME} -> ${TARGET} (proxied)"

      - name: Install Zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build with Zola
        run: zola build --base-url "${{ steps.names.outputs.url }}"

      - name: Keep staging out of search results
        run: |
          # Cloudflare Pages honours _headers; GitHub Pages ignores it, so this
          # is appended at build time rather than committed, to be certain it
          # can never apply to production.
          #
          # Deliberately no robots.txt Disallow: blocking the crawler would stop
          # it ever reading this header, and a blocked URL can still be indexed
          # from a link. noindex has to be crawlable to be obeyed.
          #
          # Inserted into the existing "/*" rule rather than appended as a second
          # one, so the result does not depend on how duplicate rules are merged.
          if [ -f public/_headers ] && grep -qE '^/\*[[:space:]]*$' public/_headers; then
            awk '{ print }
                 /^\/\*[[:space:]]*$/ && !done { print "  X-Robots-Tag: noindex, nofollow"; done = 1 }' \
              public/_headers > public/_headers.new
            mv public/_headers.new public/_headers
          else
            printf '/*\n  X-Robots-Tag: noindex, nofollow\n' >> public/_headers
          fi
          echo "--- _headers ---"
          cat public/_headers

      - name: Ensure the Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"

          if api "${base}/${CF_PROJECT}" | jq -e '.success' >/dev/null; then
            echo "Pages project exists: ${CF_PROJECT}"
            exit 0
          fi

          # Created on demand so the project name can never drift from this
          # workflow. "production" is deliberately not a pr-<number> branch, so
          # every deployment made here is a preview.
          out=$(api -X POST "$base" -d "$(jq -nc --arg n "$CF_PROJECT" '{name:$n,production_branch:"production"}')")
          if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
            echo "Pages project created: ${CF_PROJECT}"
          else
            echo "::error::could not create Pages project: $(echo "$out" | jq -c '.errors')"
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name=${{ env.CF_PROJECT }}
            --branch=${{ steps.names.outputs.branch }}

      - name: Attach the staging subdomain
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOSTNAME: ${{ steps.names.outputs.hostname }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "$@"; }

          # The DNS record already exists; this attaches the hostname to the
          # project, which is what makes Cloudflare issue its certificate.
          # Already attached is not an error.
          out=$(api -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains" \
            -d "$(jq -nc --arg n "$HOSTNAME" '{name:$n}')")
          if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
            echo "custom domain attached: ${HOSTNAME}"
          elif echo "$out" | jq -e '[.errors[]?.message // ""] | any(test("already"; "i"))' >/dev/null; then
            echo "custom domain already attached: ${HOSTNAME}"
          else
            echo "::error::$(echo "$out" | jq -c '.errors')"
            exit 1
          fi

      - name: Wait until the preview answers
        env:
          PREVIEW_URL: ${{ steps.names.outputs.url }}
        run: |
          # A newly attached hostname needs a certificate issued and routed
          # before it serves anything; until then it fails outright or returns
          # 5xx. Waiting here means the link is live by the time it is posted.
          for i in $(seq 1 50); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PREVIEW_URL}/" 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "preview live after ~$((i * 6))s"
              exit 0
            fi
            printf 'waiting (%s) ... %ss\n' "${code:-000}" "$((i * 6))"
            sleep 6
          done
          echo "::error::preview did not become reachable at ${PREVIEW_URL}"
          exit 1

      - name: Comment the preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.names.outputs.url }}
        with:
          script: |
            // The marker is how the step finds its own comment to update
            // instead of posting a new one on every push.
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\nStaging preview: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
