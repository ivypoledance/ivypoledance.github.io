# Builds the site and publishes it to GitHub Pages at https://ivypoledance.at
#
# The build steps are shared with the preview workflow through the composite
# actions in .github/actions/, so production and staging cannot drift apart.

name: Publish the site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 🏗️ Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        uses: ./.github/actions/build-site
      - name: Render the legal documents
        uses: ./.github/actions/legal-pdfs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    name: 🚀 Publish to Pages
    environment:
      name: Production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
