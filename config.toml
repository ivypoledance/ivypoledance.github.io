# The URL the site will be built for
base_url = "https://ivypoledance.at/"
title = "Ivy Poledance"
description = "Kurse, Privatstunden, Workshops und Performances in Wien und Umgebung"

theme = "adidoks"

compile_sass = true
build_search_index = true

taxonomies = [
  {name = "authors"},
]

[markdown]
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
# Zola defaults this to true; kept off so external links stay
# rel="noopener nofollow noreferrer".
external_links_external = false

[link_checker]
internal_level = "error"
external_level = "error"

[extra]
# Put all your custom variables here

# The `lang` attribute of every page, set in templates/base.html. All content is
# Austrian German, which is what spell-checkers, hyphenation and screen readers
# key off.
#
# `default_language` deliberately stays at Zola's "en": it selects the stemming
# pipeline for the search index, and a German index names `trimmer-de` and
# `stemmer-de` in its pipeline. elasticlunr throws "Cannot load un-registered
# function" on those unless lunr.de.js is loaded first, which the theme does not
# ship, so setting it would trade a correct `lang` for a dead search box.
language_code = "de-AT"

# The picture a shared link is rendered with, resized for the card in
# templates/macros/head.html. Any image in static/ can stand in for it; the
# landing image is used because it carries the wordmark.
preview_image = "/img/landing/web.jpeg"
preview_image_alt = "Ivy Poledance"

[extra.footer]
info = " "

